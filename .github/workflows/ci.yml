name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: krishinetra
          POSTGRES_PASSWORD: krishinetra
          POSTGRES_DB: krishinetra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U krishinetra -d krishinetra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://krishinetra:krishinetra@localhost:5432/krishinetra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Repository layout (E-00-S01)
        run: uv run python tests/unit/test_repo_layout.py

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Import boundaries (E-00-S05)
        run: uv run python scripts/check_imports.py

      - name: Mypy
        run: uv run mypy

      - name: Alembic migrations (E-01-S01)
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest
